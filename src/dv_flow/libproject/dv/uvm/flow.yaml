package:
  name: project.dv.uvm
  desc: UVM project archetype -- the project.dv interface plus the UVM building blocks

  doc: |-
    The base a UVM verification project inherits from:

        package:
          name: my-project
          uses: project.dv.uvm
          imports:
          - project.dv.uvm

          tasks:
          - override: src-rtl
            needs: [rtl]
          - override: tests
            needs: [uvm.uvm-tests]

    Two things come with it. From `project.dv`, inherited: the project
    interface (`src-rtl`, `src-spl`, `lint-rtl`), the `tests`/`tests-info`
    entrypoints, the `--sim`/`--build` knobs and the `flags-<stage>-<variant>`
    holders those knobs select, and the `sv-module`/`sv-package` FileSet
    conveniences. From `project.dv.uvm.utils`, imported and so in scope: the
    UVM compounds (`env-base`, `tb-img`, `tb-base`, `run`).

    THIS package adds no tasks of its own, and that is the intended shape
    rather than an unfinished one. `project.dv` is methodology-neutral so a
    cocotb or formal archetype can sit beside this one on the same interface;
    the UVM specifics are compounds a project instantiates, not tasks it
    inherits. What this package contributes is the pairing -- inherit one name
    and the UVM blocks are in scope wired to the same knobs.

  imports:
  # `uses:` names the base; the import is what puts it in scope to be found.
  # Both are required.
  - project.dv
  # Not inherited -- imported so a project that inherits this one can
  # instantiate the UVM compounds by name without importing them itself.
  - project.dv.uvm.utils

  uses: project.dv
