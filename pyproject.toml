[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "dv-flow-libproject"
version = "0.0.1"
dependencies = [
    # Needs `uses:` inheritance of package VARIABLES: without it a project
    # inheriting project.dv gets the --sim/--build flags but not the variables
    # they set. Deliberately unpinned -- consumers track dv-flow-mgr tip.
    "dv-flow-mgr",
    # project.dv's flag holders and test entrypoints, and every compound in
    # project.dv.uvm.utils, are hdlsim tasks.
    "dv-flow-libhdlsim",
]
authors = [
    {name = "Matthew Ballance", email = "matt.ballance@gmail.com"},
]
description = "Provides dv-flow project archetypes and methodology-specific template tasks"
license = {file = "LICENSE"}

[project.optional-dependencies]
# For someone building the docs without ivpm. `myst-parser` is required rather
# than optional: docs/conf.py sets `dvflow_doc_format = "markdown"`, which is
# inert unless myst_parser is a registered extension.
#
# NOT listed: sphinx-dv-flow, which is not published on PyPI. A direct git
# reference here would be rejected by PyPI for this package's own metadata, so
# install it separately:
#
#   pip install -e .[docs] git+https://github.com/dv-flow/sphinx-dv-flow.git
#
# `ivpm update -d default-dev` handles the whole set -- see docs/contributing.
docs = [
    "sphinx",
    "furo",
    "sphinxcontrib-mermaid",
    "myst-parser",
]

[project.entry-points."dv_flow.mgr"]
libproject = "dv_flow.libproject.__ext__"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"dv_flow.libproject" = ["**/flow.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
